<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <rect width="960" height="300" rx="14" fill="#fafafa"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a"/></marker>
  </defs>
  <g fill="#18181b">
    <!-- Owner -->
    <rect x="24" y="110" width="120" height="70" rx="10" fill="#18181b"/>
    <text x="84" y="140" text-anchor="middle" fill="#fff" font-weight="600">You</text>
    <text x="84" y="160" text-anchor="middle" fill="#d4d4d8" font-size="11">Project Owner</text>
    <!-- PM -->
    <rect x="200" y="110" width="140" height="70" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="270" y="138" text-anchor="middle" font-weight="600">PM agent</text>
    <text x="270" y="158" text-anchor="middle" fill="#52525b" font-size="11">plans · assigns · reports</text>
    <!-- Tasks -->
    <rect x="396" y="110" width="130" height="70" rx="10" fill="#fff" stroke="#d4d4d8"/>
    <text x="461" y="138" text-anchor="middle" font-weight="600">Tasks</text>
    <text x="461" y="158" text-anchor="middle" fill="#52525b" font-size="11">deps · criteria · board</text>
    <!-- Devs -->
    <rect x="582" y="40" width="140" height="56" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text x="652" y="64" text-anchor="middle" font-weight="600">Developer A</text>
    <text x="652" y="82" text-anchor="middle" fill="#52525b" font-size="11">account 1 · worktree</text>
    <rect x="582" y="194" width="140" height="56" rx="10" fill="#ecfdf5" stroke="#10b981"/>
    <text x="652" y="218" text-anchor="middle" font-weight="600">Developer B</text>
    <text x="652" y="236" text-anchor="middle" fill="#52525b" font-size="11">account 2 · worktree</text>
    <!-- Reviewer -->
    <rect x="770" y="40" width="160" height="56" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text x="850" y="64" text-anchor="middle" font-weight="600">Reviewer agent</text>
    <text x="850" y="82" text-anchor="middle" fill="#52525b" font-size="11">approve / request changes</text>
    <!-- Merge -->
    <rect x="770" y="194" width="160" height="56" rx="10" fill="#fff" stroke="#d4d4d8"/>
    <text x="850" y="218" text-anchor="middle" font-weight="600">AgentOS merges</text>
    <text x="850" y="236" text-anchor="middle" fill="#52525b" font-size="11">task branch → main</text>
  </g>
  <g stroke="#71717a" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M144 135 H198"/>
    <path d="M340 145 H394"/>
    <path d="M526 130 C550 100 560 75 580 70"/>
    <path d="M526 160 C550 190 560 215 580 220"/>
    <path d="M722 68 H768"/>
    <path d="M722 222 C745 200 760 120 800 98"/>
    <path d="M850 96 V192"/>
  </g>
  <g stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
    <path d="M200 175 C160 230 110 230 90 182"/>
  </g>
  <text x="128" y="250" fill="#b45309" font-size="11">approvals · questions · reports</text>
  <text x="726" y="56" fill="#71717a" font-size="11">submit</text>
  <text x="752" y="170" fill="#71717a" font-size="11">submit</text>
  <text x="858" y="150" fill="#71717a" font-size="11">approved</text>
  <text x="24" y="285" fill="#71717a" font-size="11">All coordination goes through AgentOS (MCP tools); every message, task, decision and run is persisted and visible in the dashboard.</text>
</svg>
